  - id: dag
    disposition: real-impl
    mock:
      impl: "n/a -- discover() is pure, path-confined, write-nothing; no mock/live split (dbt_files.py:26-30)"
    production:
      impl: "dqagent.adapters.dag.dbt_files.discover  # @seam(\"dag\"), dqagent/adapters/dag/dbt_files.py:26-27,
             confirmed"
