  - id: clock
    disposition: absent
    mock:
      impl: null
    production:
      impl: null
      env: []
    fail_closed_test: null
    parity_test: null
    note: "CLOSED per the before-build red team (docs/blackboard.md, 2026-10-31 K7/K8/K9 red-team entry, point 6):
           two independent full-tree greps (architect seat design pass + red team) both found zero
           'class FrozenClock' / 'class SystemClock' matches anywhere in dqagent/. Re-run a THIRD time in this
           dispatch (Grep, pattern 'class FrozenClock|class SystemClock', path dqagent/) -- zero matches, same
           result. PFP P1-M's claim ('clock: real-impl, injectable where it already is', :376) is stale; this
           entry overrides it per the two-confirmation rule, now satisfied three times over. Time in this
