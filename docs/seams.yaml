      impl: "tower/src/lib/api.ts's callRaw() fetch() branch, api.ts:150-176"
      env: ["NEXT_PUBLIC_DQ_API", "NEXT_PUBLIC_DQ_IDP", "NEXT_PUBLIC_DQ_MOCK"]
    fail_closed_test: null
    parity_test: null
    note: "Correction to K7_K8_K9_DESIGN.md §1.3: that table cited PFP's line numbers (api.ts:142-143,288-289) as
           not independently re-opened. This dispatch read tower/src/lib/api.ts in full (337 lines): the actual
           dispatch is callRaw() (api.ts:144-176), a single MOCK-gated if/else with the mock import already
           hoisted to module scope (api.ts:1-2), not two separate call sites at the PFP-cited line numbers (that
           file has since been restructured -- those exact line numbers no longer hold this logic). The
