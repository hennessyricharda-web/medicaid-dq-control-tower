# Seam manifest (K7, PFP P1-M; binding per PARTF_IMPLEMENTATION_PLAN.md:370-401).
#
# Built from scratch: this file, and the two tests that check it (tests/t0/test_seam_manifest.py,
# tests/t0/test_mock_flags_default_off.py), were confirmed ABSENT before this build (K7_K8_K9_DESIGN.md §1.1,
# re-confirmed independently in this dispatch by Glob + Grep, both returning zero matches, 2026-10-31).
#
# Entry shape (PFP P1-M, verbatim):
#   id, disposition: real-impl|fail-closed-stub|mock-only|planned|absent,
#   mock: {impl}, production: {impl, env: [...]},
#   fail_closed_test: <nodeid>, parity_test: <nodeid>
#
# Every `file:line` below was re-read directly in this dispatch against the tree (code hash stated by the
# orchestrator at dispatch: d1fd11244956f2cad200a43b76c6877c45b9e7a5909ecce32037ee697778b1c9 -- a baseline only,
# not a freeze-check this seat enforces). Corrections to the K7_K8_K9_DESIGN.md §1.3 table found in this pass are
# called out inline, and restated in the handback report.
#
# IMPORTANT, found in this dispatch (not in the design): tests/t1/test_mock_parity.py is one of the 6 stale PFP
# citations confirmed ABSENT (K7_K8_K9_DESIGN.md §1.1) -- it is Tower / Backend-LLM-Obs's own deliverable, built
# in a SEPARATE, parallel dispatch, not this one. test_seam_manifest.py::test_cited_test_ids_resolve requires
# every cited node id to resolve under `pytest --collect-only -q` TODAY. Citing that file's test ids as
# `parity_test` values now would make this seat's own manifest test fail against the tree as it stands at this
# dispatch. Both rows that would otherwise cite it (`tower.datasource`, `catalog.profile_draft`) are therefore
# written with `parity_test: null` and a note instead -- the orchestrator should update both once
# test_mock_parity.py lands and is gated together with this file, the same update this file already asks for on
# `catalog.profile_draft`'s `production.impl`.

seams:
  - id: deployment
    disposition: real-impl
    mock:
      impl: "n/a -- dqagent/deploy.py has no @seam marker and no mock/live split; it is the pure-Python
             infrastructure the seam system itself is built from (SEAMS registry, seam() decorator,
             dqagent/deploy.py:31,39-44), not a seam with two sides."
    production:
      impl: "dqagent.deploy.resolve"
      env: ["DQ_DEPLOYMENT"]
    fail_closed_test: "tests/t1/test_production_paths.py::test_default_deployment_is_production"
    parity_test: null
    note: "Not traced to an @seam() marker. test_seam_manifest.py::test_every_entry_has_both_sides allows this one
           named exception (see test file docstring): deployment is infrastructure a seam entry documents for
           completeness (PFP :376 lists it explicitly), not an implementation SEAMS tracks. Every OTHER entry in
           this file traces to a real @seam() call site, except dataplane and explanation_cache (same exception,
           noted at each)."

  - id: secrets
    disposition: real-impl
    mock:
      impl: "dqagent.secrets.TEST_KEYS (labelled literal keys; test/demo only, dqagent/deploy.py:18)"
    production:
      impl: "dqagent.secrets.EnvSecrets  # @seam(\"secrets\"), dqagent/secrets.py:16-17, confirmed present"
      env: ["DQ_K_EV", "DQ_K_FP", "DQ_K_ABC"]
    fail_closed_test: "tests/t1/test_production_paths.py::test_production_without_env_keys_raises"
    parity_test: null

  - id: llm.provider
    disposition: real-impl
    mock:
      impl: "dqagent.llm (provider=\"template\"; no vendor call at all, dqagent/llm/__init__.py -- a distinct
             code path, not an alternate implementation of this seam; it is the llm.provider seam's ABSENCE, by
             design, not its mock side)"
    production:
      impl: "dqagent.llm.providers.anthropic, .watsonx, .azure_openai, .cortex
             # @seam(\"llm.provider\") added on each module's configured() function this dispatch (see report).
             # 'Real-impl', not fail-closed-stub: traced the actual failure path end to end this dispatch --
             # llm/providers/__init__.py:10 ('Neither ever raises') and :88 ('a provider failure never reaches
             # the caller') are binding. complete_via's UNCONFIGURED branch (__init__.py:70-73) returns a
             # Completion with reason_code=UNCONFIGURED; llm.explain_result (llm/__init__.py:181-199) turns that
             # into fact_check=FALLBACK and SHOWS THE TEMPLATE -- it never raises NotConfiguredError or any other
             # exception. Confirmed against tests/t0/test_parte_explainer.py:278-285
             # (test_provider_malformed_and_unconfigured_fall_back: asserts fact_check == 'FALLBACK' with env={},
             # i.e. unconfigured, never pytest.raises). These 4 modules are functionally real, live-reachable
             # implementations (each builds a real vendor request and parses a real vendor response shape) that
             # are simply untested live (L-14, no credentials) -- the same class as llm.transport's HttpTransport
             # below, which is also real-impl despite being 'not exercised live'."
      env: ["DQ_EXPLAINER_ANTHROPIC_MODEL", "DQ_EXPLAINER_ANTHROPIC_ENDPOINT", "DQ_EXPLAINER_ANTHROPIC_KEY",
            "DQ_EXPLAINER_WATSONX_MODEL", "DQ_EXPLAINER_WATSONX_ENDPOINT", "DQ_EXPLAINER_WATSONX_TOKEN",
            "DQ_EXPLAINER_WATSONX_PROJECT", "DQ_EXPLAINER_AZURE_OPENAI_ENDPOINT", "DQ_EXPLAINER_AZURE_OPENAI_KEY",
            "DQ_EXPLAINER_AZURE_OPENAI_DEPLOYMENT", "DQ_EXPLAINER_CORTEX_MODEL", "DQ_EXPLAINER_CORTEX_ENDPOINT",
            "DQ_EXPLAINER_CORTEX_TOKEN"]
    fail_closed_test: null
    parity_test: null
    note: "Correction to K7_K8_K9_DESIGN.md §1.3 in TWO ways. First (as the design itself flagged): the 4 provider
           modules were not @seam-marked; this dispatch's brief (Decision #1, orchestrator, 2026-10-31) resolves
           that by adding @seam(\"llm.provider\") to each module's configured() function (not to a class -- these
           modules are plain functions, not classes, confirmed by reading all 4 files in full this dispatch).
           Second (found independently in this dispatch, not inherited from the design): the design's own §1.3
           row for this seam proposed disposition fail-closed-stub on the theory that an unconfigured provider
           'fails closed, L-14'. Tracing complete_via's actual call path shows this is wrong -- an unconfigured
           vendor provider FALLS BACK to the template silently; it does not raise, and no caller sees a refusal.
           fail-closed-stub is reserved for a seam whose failure path genuinely raises (idp is the correct
           example of that disposition in this file). Restated as real-impl, with no fail_closed_test, matching
           the sibling llm.transport entry's precedent for a real implementation that happens to be untested
           live."

  - id: llm.transport
    disposition: real-impl
    mock:
      impl: "dqagent.llm.transports.ScriptedTransport, .RecordedTransport (test/demo only,
             dqagent/llm/transports.py:120,159); .FixedTransport (test only, :177)"
    production:
      impl: "dqagent.llm.transports.HttpTransport  # @seam(\"llm.transport\"), transports.py:93-97, confirmed"
      env: []
    fail_closed_test: "tests/t1/test_production_paths.py::test_transport_allowlist_by_deployment_deploy_side"
    parity_test: null
    note: "Only HttpTransport carries @seam (design choice restated, not re-decided here): the non-live
           transports are deployment-gated TEST fixtures (dqagent.deploy.TRANSPORTS allow-list,
           dqagent/deploy.py:24-29), not alternate production implementations of this seam."

  - id: idp
    disposition: fail-closed-stub
    mock:
      impl: "dqagent.hitl.idp.LocalIdP  (dqagent/hitl/idp.py:22; test/demo/pilot -- pilot shows the 'not
             production' chip, dqagent/deploy.py:79)"
    production:
      impl: "none -- no OidcIdP class exists (confirmed by grep across dqagent/ for 'OidcIdP' and 'class.*IdP',
             only LocalIdP found). The fail-closed path IS built: Runtime._check_deployment raises
             NotConfiguredError before an OIDC IdP would be needed (dqagent/runtime.py:224-229, L-16 in
             docs/BACKLOG.md:104)."
      env: ["DQ_OIDC_ISSUER"]
    fail_closed_test: "tests/t1/test_production_paths.py::test_production_without_oidc_raises"
    parity_test: null
    note: "fail_closed_test re-confirmed resolvable this dispatch (tests/t1/test_production_paths.py:74-81, read
           directly): asserts NotConfiguredError matching 'OIDC' with no DQ_OIDC_ISSUER set, then matching 'not
           implemented' once DQ_OIDC_ISSUER is set but no OIDC IdP exists (runtime.py:227-229). Matches the K7
           design's citation verbatim; no correction needed here."

  - id: dataplane
    disposition: real-impl
    mock:
      impl: "n/a -- no DuckDB/mock split; DuckDB IS the T1 reference implementation (duckdb_dp.py:1-11 docstring).
             Snowflake/Databricks/BigQuery adapters are planned, not mocked."
    production:
      impl: "dqagent.adapters.dataplane.duckdb_dp.DuckDBDataPlane  (dqagent/adapters/dataplane/duckdb_dp.py:24,
             no @seam marker -- confirmed by grep: zero @seam( hits inside adapters/dataplane/)"
      env: []
    fail_closed_test: "tests/t1/test_production_paths.py::test_production_and_pilot_refuse_an_in_memory_data_plane"
    parity_test: null
    note: "Correction to K7_K8_K9_DESIGN.md §1.3: that table cited this seam without flagging the missing @seam
           marker explicitly. Re-confirmed this dispatch: grep for '@seam(' across dqagent/adapters/dataplane/
           returns zero hits. Disposition kept real-impl because the production side (DuckDB) functionally
           exists and is exercised everywhere -- but PFP P1-M's own test_every_seam_marker_has_an_entry check
           cannot apply to this row (nothing is marked), so this entry is NOT required by that assertion and is
           listed here for completeness only, same exception class as `deployment` above."

