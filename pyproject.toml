[project]
name = "dqagent"
version = "0.1.0"
description = "Portable, configuration-driven Data Quality control plane for state Medicaid / HHS medallion pipelines"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml", "sqlglot>=30", "duckdb>=1.1", "fastapi", "psycopg[binary]>=3.2", "httpx", "pyjwt[crypto]>=2.8", "uvicorn", "numpy"]

[project.optional-dependencies]
dbt = ["dbt-core>=1.10", "dbt-duckdb>=1.10"]
snowflake-t1 = ["fakesnow>=0.11", "snowflake-connector-python<4"]
dev = ["pytest", "ruff"]

[project.scripts]
dqagent = "dqagent.cli.main:main"

[tool.setuptools.packages.find]
include = ["dqagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sqlite_shim: ran against the SQLite CP-test shim (tests/t1/conftest_sqlite_shim.py), not Postgres -- proves nothing about roles, GRANT/REVOKE, RLS or real row-lock CAS"]

[tool.ruff]
line-length = 110
