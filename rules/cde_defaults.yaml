# Critical data elements and their minimum viable DQ (Part E §4). This is the DEFAULT designation: the effective
# designation is the governed CDE artifact <ST>:cde, seeded from this file at genesis and changed only by a change
# request (a steward's approval). rules/elements.yaml is deliberately not edited, so the catalog digest does not move.
#
#   completeness_min / validity_min   minimum pass rate (0..1) over the bound B-CMP / B-VAL / code-set rules
#   steward_domain                    the domain whose steward owns the element
# Status is computed by dqagent/rules/cde.py: MEETS | BELOW | NOT_EXERCISED (domain not delivered) | NOT_LOADED
# (code set absent). Advisory only: a CDE below its minimum never holds a unit.
cdes:
  CLM.ID:            {mvdq: {completeness_min: 1.0,  validity_min: 1.0},  steward_domain: CLAIMS}
